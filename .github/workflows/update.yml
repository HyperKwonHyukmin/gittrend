name: Update trends

# 수집 범위가 72시간이라 정기 실행이 없으면 소식을 놓친다. 2026-10-27 비용 때문에 껐다가 2026-10-31 월 API 크레딧으로 되살렸다.
on:
  schedule:
    - cron: "0 22 * * *"   # 매일 한국시간 오전 7시 (라이브러리 + AI 레이더)
    - cron: "0 9 * * *"    # 매일 한국시간 오후 6시 (낮 동안의 새 모델·릴리스도 담기 위해)
  workflow_dispatch:        # Actions 탭에서 수동 실행
  issues:
    types: [opened]         # 페이지의 [심층 분석 요청]("deep: …")·[지금 업데이트]("update") 버튼이 연 이슈

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write             # 심층 분석 요청 이슈에 댓글을 달고 닫기 위해

concurrency:
  group: update-trends
  cancel-in-progress: false

jobs:
  update:
    # 이슈로 실행될 때는 저장소 주인이 연 "deep: owner/name"(심층 분석)·"update"(수집) 이슈만 처리한다
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.author_association == 'OWNER' &&
       (startsWith(github.event.issue.title, 'deep:') || github.event.issue.title == 'update'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # 줄 서서 기다린 실행도 앞 실행이 올린 데이터 위에서 시작하게 항상 최신 main을 받는다(이벤트 시점 커밋이면 데이터 커밋이 충돌)
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # AI 정리가 중간에 멈춰도(키 오류, 크레딧 부족) 모은 데이터는 배포하고, 마지막에 실패로 표시한다
      - name: Collect and summarize
        id: collect
        if: github.event_name != 'issues' || github.event.issue.title == 'update'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          ANTHROPIC_EFFORT: ${{ vars.ANTHROPIC_EFFORT }}
          ANTHROPIC_DEEP_MODEL: ${{ vars.ANTHROPIC_DEEP_MODEL }}
          ANTHROPIC_DEEP_EFFORT: ${{ vars.ANTHROPIC_DEEP_EFFORT }}
          DEEP_PER_RUN: ${{ vars.DEEP_PER_RUN }}
          MAX_SUMMARIES: ${{ vars.MAX_SUMMARIES }}
          MAX_NEWS_AI: ${{ vars.MAX_NEWS_AI }}
          MAX_NEWS_CARDS: ${{ vars.MAX_NEWS_CARDS }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: python collect.py

      # 심층 분석 요청 이슈만 처리 (수집은 하지 않음)
      - name: Deep analysis requests
        id: deep
        if: github.event_name == 'issues' && startsWith(github.event.issue.title, 'deep:')
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          ANTHROPIC_EFFORT: ${{ vars.ANTHROPIC_EFFORT }}
          ANTHROPIC_DEEP_MODEL: ${{ vars.ANTHROPIC_DEEP_MODEL }}
          ANTHROPIC_DEEP_EFFORT: ${{ vars.ANTHROPIC_DEEP_EFFORT }}
          DEEP_PER_RUN: ${{ vars.DEEP_PER_RUN }}
          MAX_SUMMARIES: ${{ vars.MAX_SUMMARIES }}
          MAX_NEWS_AI: ${{ vars.MAX_NEWS_AI }}
          MAX_NEWS_CARDS: ${{ vars.MAX_NEWS_CARDS }}
        run: python deep.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "data: $(TZ=Asia/Seoul date +%Y-%m-%d) 업데이트"
          # 실행 중에 다른 커밋이 올라왔을 수 있으니 최신 내용 위에 얹어서 올린다
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1

      - name: 화면에 배포 버전 표시
        run: |
          git fetch -q --deepen=100 origin "${GITHUB_REF_NAME}" || true
          SHA=$(git log -1 --format=%h --abbrev=7 -- . ':!docs/data' ':!data')
          SHA=${SHA:-${GITHUB_SHA::7}}
          AT=$(TZ=KST-9 date '+%-m/%-d %H:%M')
          sed -i "s|<!--hk-build-->|<div id=\"hk-build\" aria-hidden=\"true\" style=\"position:fixed;left:6px;bottom:2px;z-index:2147483000;pointer-events:none;font:500 10px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;color:rgba(128,128,128,.95);background:rgba(128,128,128,.12);padding:0 6px;border-radius:6px;white-space:nowrap\">${SHA} · ${AT} 배포</div>|" docs/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4

      # [지금 업데이트] 이슈는 결과를 댓글로 남기고 닫는다(실패해도)
      - name: Close update request
        if: always() && github.event_name == 'issues' && github.event.issue.title == 'update'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ steps.collect.outcome == 'success' && job.status == 'success' && '업데이트를 마쳤습니다. 사이트에 반영됐어요.' || '업데이트 중 문제가 있었습니다. Actions 실행 기록을 확인해 주세요.' }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "$RESULT ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Report failure
        if: steps.collect.outcome == 'failure' || steps.deep.outcome == 'failure'
        run: |
          echo "::error::수집 또는 AI 분석 중 오류가 있었습니다. 위 단계의 로그를 확인하세요."
          exit 1
