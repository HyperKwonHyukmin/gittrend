name: Update trends

# 2026-10-27부터 정기 실행(cron) 없음: 사용자가 요청할 때만(Actions의 Run workflow, 심층 분석 이슈) 돈다. OpenAI 비용 때문.
on:
  workflow_dispatch:        # Actions 탭에서 수동 실행
  issues:
    types: [opened]         # 페이지의 [심층 분석 요청] 버튼이 연 이슈 → 바로 분석

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write             # 심층 분석 요청 이슈에 댓글을 달고 닫기 위해

concurrency:
  group: update-trends
  cancel-in-progress: false

jobs:
  update:
    # 이슈로 실행될 때는 저장소 주인이 연 "deep: owner/name" 이슈만 처리한다
    if: >-
      github.event_name != 'issues' ||
      (startsWith(github.event.issue.title, 'deep:') && github.event.issue.author_association == 'OWNER')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # AI 정리가 중간에 멈춰도(키 오류, 크레딧 부족) 모은 데이터는 배포하고, 마지막에 실패로 표시한다
      - name: Collect and summarize
        id: collect
        if: github.event_name != 'issues'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_REASONING: ${{ vars.OPENAI_REASONING }}
          OPENAI_DEEP_MODEL: ${{ vars.OPENAI_DEEP_MODEL }}
          OPENAI_DEEP_REASONING: ${{ vars.OPENAI_DEEP_REASONING }}
          DEEP_PER_RUN: ${{ vars.DEEP_PER_RUN }}
          MAX_SUMMARIES: ${{ vars.MAX_SUMMARIES }}
          MAX_NEWS_AI: ${{ vars.MAX_NEWS_AI }}
          MAX_NEWS_CARDS: ${{ vars.MAX_NEWS_CARDS }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: python collect.py

      # 심층 분석 요청 이슈만 처리 (수집은 하지 않음)
      - name: Deep analysis requests
        id: deep
        if: github.event_name == 'issues'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_REASONING: ${{ vars.OPENAI_REASONING }}
          OPENAI_DEEP_MODEL: ${{ vars.OPENAI_DEEP_MODEL }}
          OPENAI_DEEP_REASONING: ${{ vars.OPENAI_DEEP_REASONING }}
          DEEP_PER_RUN: ${{ vars.DEEP_PER_RUN }}
          MAX_SUMMARIES: ${{ vars.MAX_SUMMARIES }}
          MAX_NEWS_AI: ${{ vars.MAX_NEWS_AI }}
          MAX_NEWS_CARDS: ${{ vars.MAX_NEWS_CARDS }}
        run: python deep.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "data: $(TZ=Asia/Seoul date +%Y-%m-%d) 업데이트"
          # 실행 중에 다른 커밋이 올라왔을 수 있으니 최신 내용 위에 얹어서 올린다
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1

      - name: 화면에 배포 버전 표시
        run: |
          git fetch -q --deepen=100 origin "${GITHUB_REF_NAME}" || true
          SHA=$(git log -1 --format=%h --abbrev=7 -- . ':!docs/data' ':!data')
          SHA=${SHA:-${GITHUB_SHA::7}}
          AT=$(TZ=KST-9 date '+%-m/%-d %H:%M')
          sed -i "s|<!--hk-build-->|<div id=\"hk-build\" aria-hidden=\"true\" style=\"position:fixed;left:6px;bottom:2px;z-index:2147483000;pointer-events:none;font:500 10px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;color:rgba(128,128,128,.95);background:rgba(128,128,128,.12);padding:0 6px;border-radius:6px;white-space:nowrap\">${SHA} · ${AT} 배포</div>|" docs/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Report failure
        if: steps.collect.outcome == 'failure' || steps.deep.outcome == 'failure'
        run: |
          echo "::error::수집 또는 AI 분석 중 오류가 있었습니다. 위 단계의 로그를 확인하세요."
          exit 1
