<body>

      <a class="brand" href="#/news">
        <span class="brand-mark" aria-hidden="true">★</span>

      </a>
      <nav class="sections" aria-label="구역">
        <a class="sec" data-sec="news" href="#/news">AI 홈</a>
        <a class="sec" data-sec="lib" href="#/t/hot">라이브러리</a>

      <label class="search">

      </label>
      <!-- 워크스페이스(포털 hyperkwon.com)로 돌아가기. 로그인돼 있으면 비공개 앱 카드까지 보입니다. -->
      <a class="idea-btn ws-btn" href="https://hyperkwon.com/" title="워크스페이스로 돌아가기" aria-label="워크스페이스로 돌아가기">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>

      </a>
      <!-- 지금 보는 화면의 주소·제목을 담아 IdeaBox 입력 창을 엽니다(IdeaBox에서 'GitTrend' 태그가 붙음). -->
      <a class="idea-btn" id="idea-btn" style="text-decoration:none" href="https://idea.hyperkwon.com/new?src=GitTrend" target="ideabox" rel="noopener" title="IdeaBox로 아이디어 보내기">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5a6 6 0 0 0-3.6 10.8c.5.4.8 1 .8 1.6v.6h5.6v-.6c0-.6.3-1.2.8-1.6A6 6 0 0 0 12 3.5Z"/><path d="M9.8 20h4.4"/></svg>
        <span>아이디어</span>
      </a>
    </div>
  </header>
